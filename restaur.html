<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Document</title>
    <style>
     body {
    font-family: arial,;
    background: #fff8f0;
    padding: 30px;
    text-align: center;
     }
    
     h1 {color: #e65c00;}

     h1 + p {
    background: #ffe0b2;
    padding: 10px 20px;
    border-radius: 8px;
    color: #bf360c;
    display: inline-block;
     }

    ul {padding: 0; margin-top: 20px;}
    
    ul > li {
        list-style: none;
    font-size: 18px;
    font-weight: bold;
    color: #5d4037;
    padding: 10px 20px;
   margin: 6px auto;
    width: 260px;
    background: #fff3e0;
    border-radius: 8px;
    }
    ul li:nth-child(3) {
        background: #ffe082;
        color: #e65c00;
    }
    
    .desc {
    color: #555;
    margin-top: 20px;
    font-size: 15px;
    max-width: 400px;
    margin-left: auto;
    margin-right: auto;
    }

    

    .desc::first-letter {
    font-size: 220%;
    color: #e65c00;
    font-weight: bold;
    }
     .links {margin-top: 25px;}
     a{
    color: #e65c00;
    text-decoration: none;
    font-size: 15px;
    margin: 0 12px;
    padding: 8px;
    border: 2p solid #e65c00;
    border-radius: 8px;
     }
    a:hover {
      background: #e65c00;
      color: white;
    }
    </style>
</head>
<body>
    <h1> my food menu</h1>
    <p> pick your favorite dish and dig in!</p>
    <ul>
   <li>banana spilt</li>
    <li>rotisere chicken</li>

    </ul>

    <p class="desc"> every dish on this menu is made with love
        and respect</p>

       </div>
